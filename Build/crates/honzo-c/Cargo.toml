[package]
name = "honzo-c"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "C FFI bindings for the Honzo ebook format"
readme = "../../../README.md"
homepage = "https://nisoku.org/Honzo"
repository = "https://github.com/Nisoku/Honzo"

[features]
default = ["image"]
image = ["honzo-chunks/image", "honzo-io/image"]

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
diplomat = "0.15"
diplomat-runtime = "0.15"
honzo-chunks = { path = "../honzo-chunks", version = "0.1", default-features = false }
honzo-core = { path = "../honzo-core", version = "0.1" }
honzo-io = { path = "../honzo-io", version = "0.1", default-features = false }
rmp-serde = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
diplomat-tool = "0.15"

[dev-dependencies]
honzo-io = { path = "../honzo-io", version = "0.1" }
rmp-serde = "1"
