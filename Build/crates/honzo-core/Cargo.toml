[package]
name = "honzo-core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[features]
default = []
alloc = []
compression = ["alloc", "lz4_flex"]

[dependencies]
crc32fast = { version = "1.4", default-features = false }
lz4_flex = { version = "0.13.1", optional = true, default-features = false, features = ["safe-encode", "safe-decode"] }
