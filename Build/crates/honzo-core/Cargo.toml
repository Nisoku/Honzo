[package]
name = "honzo-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Core no_std Honzo ebook format parser with optional LZ4 compression"
readme = "../../../README.md"
homepage = "https://nisoku.org/Honzo"
repository = "https://github.com/Nisoku/Honzo"

[features]
default = []
alloc = []
compression = ["alloc", "lz4_flex"]

[dependencies]
crc32fast = { version = "1.4", default-features = false }
lz4_flex = { version = "0.14.0", optional = true, default-features = false, features = ["safe-encode", "safe-decode", "alloc"] }
