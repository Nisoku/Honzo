[package]
name = "honzo-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Core no_std Honzo ebook format parser with optional LZ4 compression"

[features]
default = []
alloc = []
compression = ["alloc", "lz4_flex"]

[dependencies]
crc32fast = { version = "1.4", default-features = false }
lz4_flex = { version = "0.13.1", optional = true, default-features = false, features = ["safe-encode", "safe-decode"] }
