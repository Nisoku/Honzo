[package]
name = "honzo-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WASM bindings for the Honzo ebook format"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
honzo-chunks = { path = "../honzo-chunks", version = "0.1" }
honzo-convert = { path = "../honzo-convert", version = "0.1" }
honzo-core = { path = "../honzo-core", version = "0.1" }
honzo-io = { path = "../honzo-io", version = "0.1" }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"
serde-wasm-bindgen = "0.6"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
