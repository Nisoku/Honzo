[package]
name = "honzo-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Honzo ebook format CLI tools"
readme = "../../../README.md"
homepage = "https://honzo.nisoku.org"
repository = "https://github.com/Nisoku/Honzo"

[dependencies]
honzo-core = { path = "../honzo-core", version = "0.1" }
honzo-io = { path = "../honzo-io", version = "0.1" }
honzo-convert = { path = "../honzo-convert", version = "0.1" }
clap = { version = "4.5", features = ["derive"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
rmp-serde = "1"
glob = "0.3"
