[package]
name = "honzo-cli"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
honzo-core = { path = "../honzo-core" }
honzo-std = { path = "../honzo-std" }
honzo-convert = { path = "../honzo-convert" }
clap = { version = "4.5", features = ["derive"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
rmp-serde = "1"
