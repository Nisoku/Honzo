[package]
name = "honzo-convert"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Honzo ebook format conversion from EPUB, MOBI, PDF, and CBZ"
readme = "../../../README.md"
homepage = "https://nisoku.org/Honzo"
repository = "https://github.com/Nisoku/Honzo"

[features]
default = []
lowmem = []

[dependencies]
honzo-io = { path = "../honzo-io", version = "0.1" }
honzo-chunks = { path = "../honzo-chunks", version = "0.1" }
lexepub = "0.1"
bytes = "1"
quick-xml = "0.42"
rmp-serde = "1"
tl = "0.7"
html-escape = "0.2"
mobi = "0.8"
pdf_oxide = "0.3"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
regex = "1"

[dev-dependencies]
honzo-core = { path = "../honzo-core", version = "0.1" }
honzo-io = { path = "../honzo-io", version = "0.1" }
