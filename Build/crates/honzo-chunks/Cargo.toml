[package]
name = "honzo-chunks"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Honzo ebook chunk types, validation, and analysis"
readme = "../../../README.md"
homepage = "https://nisoku.org/Honzo"
repository = "https://github.com/Nisoku/Honzo"

[features]
default = ["image"]
image = ["dep:image"]

[dependencies]
honzo-core = { path = "../honzo-core", version = "0.1" }

lz4_flex = "0.14.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "bmp", "tiff", "webp", "ico", "pnm"], optional = true }
rmp-serde = "1"
serde = { version = "1", features = ["derive"] }
cssparser = "0.37"
pulldown-latex = "0.7"
quick-xml = "0.41"
rust-stemmers = "1"
lexepub = "0.1"

[dev-dependencies]
tempfile = "3.3"
pretty_assertions = "1.3"
