[package]
name = "honzo-chunks"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
honzo-core = { path = "../honzo-core" }

lz4_flex = "0.13.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "tiff", "webp", "ico", "pnm"] }
rmp-serde = "1"
serde = { version = "1", features = ["derive"] }
cssparser = "0.37"
pulldown-latex = "0.7"
quick-xml = "0.40"
rust-stemmers = "1"
lexepub = "0.1"
