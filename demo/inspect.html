<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      http-equiv="Content-Security-Policy"
      content="
    default-src 'self' blob: data:;
    script-src 'self' 'unsafe-eval';
    style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
    font-src 'self' https://fonts.gstatic.com;
    img-src 'self' blob: data:;
    connect-src 'self';
    frame-src 'self' blob: data:;
    worker-src 'self';
    manifest-src 'self';
    upgrade-insecure-requests; block-all-mixed-content;"
    />
    <title>HonzoInspect</title>
    <link rel="icon" href="/Honzo/demo/source.svg" type="image/svg+xml" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600&family=Merriweather:wght@300;400;700&family=IBM+Plex+Serif:wght@300;400;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script type="module" crossorigin src="/Honzo/demo/assets/inspect-Dsw7Cs78.js"></script>
    <link rel="modulepreload" crossorigin href="/Honzo/demo/assets/honzo_wasm-BI4v5saS.js">
    <link rel="modulepreload" crossorigin href="/Honzo/demo/assets/esc-Bzx7pNv8.js">
    <link rel="modulepreload" crossorigin href="/Honzo/demo/assets/download-DA2FER3_.js">
    <link rel="stylesheet" crossorigin href="/Honzo/demo/assets/honzo_wasm-DokVk88q.css">
    <link rel="stylesheet" crossorigin href="/Honzo/demo/assets/inspect-BPY68LJU.css">
  <link rel="manifest" href="/Honzo/demo/manifest.webmanifest"><script id="vite-plugin-pwa:register-sw" src="/Honzo/demo/registerSW.js"></script></head>

  <body class="page-scroll">
    <header id="app-header">
      <div class="header-left">
        <span class="app-title">HonzoInspect</span>
      </div>
      <div class="header-center">
        <span class="title-separator">·</span>
        <span class="book-title">File Inspector</span>
      </div>
      <div class="header-right">
        <nav class="header-nav">
          <a href="/Honzo/demo/">Reader</a>
          <a href="/Honzo/demo/convert.html">Convert</a>
          <a href="/Honzo/demo/maker.html">Maker</a>
        </nav>
      </div>
    </header>

    <div class="container inspect-layout">
      <div class="drop-zone" id="dropZone">
        <div class="icon">
          <i data-lucide="download" width="48" height="48" stroke-width="1.5"></i>
        </div>
        <h2>Drop a Honzo file here</h2>
        <p>or click to browse your device</p>
        <input type="file" id="fileInput" accept=".hzo" />
      </div>

      <div class="status" id="status"><span id="statusText"></span></div>

      <div class="inspect-body">
        <div class="inspect-main">
          <div class="panel inspect-meta" id="metaPanel">
            <h2>
              <i data-lucide="file-text" width="20" height="20"></i>
              Book Metadata
            </h2>
            <div class="scroll-content meta-scroll" id="metaFields"></div>
            <div class="btn-row sticky-bottom">
              <button class="btn btn-secondary" id="revertBtn" disabled>
                <i data-lucide="rotate-ccw" width="16" height="16"></i>
                Revert
              </button>
              <button class="btn btn-success" id="saveBtn" disabled>
                <i data-lucide="save" width="16" height="16"></i>
                Save
              </button>
            </div>
          </div>
        </div>

        <div class="inspect-side">
          <!-- File Info -->
          <div class="panel" id="filePanel">
            <h2>
              <i data-lucide="file-text" width="20" height="20"></i>
              File Information
            </h2>
            <div class="scroll-content">
              <div class="info-grid" id="fileInfo"></div>
            </div>
          </div>

          <!-- Content Chunks -->
          <div class="panel inspect-chunks" id="tocPanel">
            <h2>
              <i data-lucide="file-up" width="20" height="20"></i>
              Content Chunks
              <span id="chunkCount"></span>
            </h2>
            <div class="table-container">
              <table>
                <thead>
                  <tr>
                    <th>ID</th>
                    <th>Tag</th>
                    <th>Compressed</th>
                    <th>Uncompressed</th>
                    <th>Compression</th>
                    <th>Type</th>
                    <th>Flags</th>
                  </tr>
                </thead>
                <tbody id="tocBody"></tbody>
              </table>
            </div>
          </div>

          <!-- Extra Data -->
          <div class="panel" id="extraPanel">
            <h2>
              <i data-lucide="file-plus" width="20" height="20"></i>
              Extra Data
            </h2>
            <div class="scroll-content" id="extraInfo"></div>
          </div>
        </div>
      </div>
    </div>

    <footer class="powered-by">
      Powered by <a href="https://nisoku.org/Sairin/">Sairin</a><span class="sep">·</span><a href="https://nisoku.org/Satori/docs/">Satori</a>
    </footer>

  </body>
</html>
