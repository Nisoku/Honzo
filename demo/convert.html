<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      http-equiv="Content-Security-Policy"
      content="
    default-src 'self' blob: data:;
    script-src 'self' 'unsafe-eval';
    style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
    font-src 'self' https://fonts.gstatic.com;
    img-src 'self' blob: data:;
    connect-src 'self';
    frame-src 'self' blob: data:;
    worker-src 'self';
    manifest-src 'self';
    upgrade-insecure-requests; block-all-mixed-content;"
    />
    <title>HonzoConvert</title>
    <link rel="icon" href="/Honzo/demo/source.svg" type="image/svg+xml" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600&family=Merriweather:wght@300;400;700&family=IBM+Plex+Serif:wght@300;400;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script type="module" crossorigin src="/Honzo/demo/assets/convert-D_OGPHrx.js"></script>
    <link rel="modulepreload" crossorigin href="/Honzo/demo/assets/honzo_wasm-Ct211FPK.js">
    <link rel="stylesheet" crossorigin href="/Honzo/demo/assets/honzo_wasm-6-asbuWb.css">
    <link rel="stylesheet" crossorigin href="/Honzo/demo/assets/convert-DMbCtO1x.css">
  <link rel="manifest" href="/Honzo/demo/manifest.webmanifest"><script id="vite-plugin-pwa:register-sw" src="/Honzo/demo/registerSW.js"></script></head>

  <body class="page-scroll">
    <!-- Header -->
    <header id="app-header">
      <div class="header-left">
        <span class="app-title">HonzoConvert</span>
      </div>
      <div class="header-center"></div>
      <div class="header-right">
        <nav class="header-nav">
          <a href="/Honzo/demo/">Reader</a>
          <a href="/Honzo/demo/inspect.html">Inspect</a>
          <a href="/Honzo/demo/maker.html">Maker</a>
        </nav>
      </div>
    </header>

    <div class="container container-narrow">
      <h1 class="page-title">Convert EPUB</h1>

      <div class="drop-zone" id="dropZone">
        <div class="icon">
          <i data-lucide="book-up" width="48" height="48" stroke-width="1.5"></i>
        </div>
        <h2>Drop an EPUB here</h2>
        <p>or click to browse</p>
        <input type="file" id="fileInput" accept=".epub" />
      </div>

      <div class="status" id="status">
        <span id="statusText"></span>
        <div class="progress-bar">
          <div class="fill" id="progressFill"></div>
        </div>
      </div>

      <div class="history" id="history">
        <h3>Converted Files</h3>
        <div id="historyList"></div>
      </div>
    </div>

    <footer class="powered-by">
      Powered by <a href="https://nisoku.org/Sairin/">Sairin</a><span class="sep">·</span><a href="https://nisoku.org/Satori/docs/">Satori</a>
    </footer>

  </body>
</html>
