<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HonzoInspect</title>
    <link rel="icon" href="/Honzo/demo/source.svg" type="image/svg+xml" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./src/style.css" />
  </head>

  <body class="page-scroll">
    <header>
      <h1 class="title">HonzoInspect</h1>
      <div class="header-nav">
        <a href="/Honzo/demo/">Reader</a>
        <a href="/Honzo/demo/convert.html">Convert</a>
      </div>
    </header>
    <div class="container container-grid">
      <div class="drop-zone" id="dropZone">
        <div class="icon">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
            width="48"
            height="48"
          >
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
            <path d="M7 10l5 5 5-5" />
            <path d="M12 15V3" />
          </svg>
        </div>
        <h2>Drop a Honzo file here</h2>
        <p>or click to browse your device</p>
        <input type="file" id="fileInput" accept=".hzo" />
      </div>

      <div class="status" id="status"><span id="statusText"></span></div>

      <!-- File Info Panel -->
      <div class="panel" id="filePanel">
        <h2>
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"
            />
            <polyline points="14 2 14 8 20 8" />
            <line x1="16" y1="13" x2="8" y2="13" />
            <line x1="16" y1="17" x2="8" y2="17" />
            <polyline points="10 9 9 9 8 9" />
          </svg>
          File Information
        </h2>
        <div class="info-grid" id="fileInfo"></div>
      </div>

      <!-- TOC Panel -->
      <div class="panel" id="tocPanel">
        <h2>
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"
            />
            <line x1="12" y1="11" x2="12" y2="17" />
            <path d="M7 14l5-5 5 5" />
          </svg>
          Content Chunks
          <span
            id="chunkCount"
            style="
              color: var(--text-light);
              font-weight: 400;
              font-size: 0.9rem;
            "
          ></span>
        </h2>
        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Tag</th>
                <th>Compressed</th>
                <th>Uncompressed</th>
                <th>Compression</th>
                <th>Type</th>
                <th>Flags</th>
              </tr>
            </thead>
            <tbody id="tocBody"></tbody>
          </table>
        </div>
      </div>

      <!-- Metadata Panel -->
      <div class="panel" id="metaPanel">
        <h2>
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
            <path
              d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"
            />
            <path d="M8 7h7" />
            <path d="M8 12h7" />
            <path d="M8 17h7" />
          </svg>
          Book Metadata
        </h2>
        <div id="metaFields" class="scroll-content"></div>
        <div class="btn-row sticky-bottom">
          <button class="btn btn-secondary" id="revertBtn" disabled>
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M3 12a9 9 0 1 1 18 0 9 9 0 0 1-18 0z" />
              <path d="M12 8v4l3 3" />
            </svg>
            Revert
          </button>
          <button class="btn btn-success" id="saveBtn" disabled>
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"
              />
              <polyline points="17 21 17 13 7 13 7 21" />
              <polyline points="7 3 7 8 15 8" />
            </svg>
            Save
          </button>
        </div>
      </div>

      <!-- Extra Data Panel -->
      <div class="panel" id="extraPanel">
        <h2>
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"
            />
            <polyline points="14 2 14 8 20 8" />
            <line x1="16" y1="13" x2="8" y2="13" />
            <line x1="16" y1="17" x2="8" y2="17" />
            <polyline points="10 9 9 9 8 9" />
            <path d="M18 12h-2v-2" />
            <path d="M18 16h-2v-2" />
          </svg>
          Extra Data
        </h2>
        <div id="extraInfo" class="scroll-content"></div>
      </div>
    </div>
    <script type="module" src="./src/inspect.js"></script>
  </body>
</html>
