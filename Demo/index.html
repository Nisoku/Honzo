<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      http-equiv="Content-Security-Policy"
      content="
    default-src 'self' blob: data:;
    script-src 'self' 'unsafe-eval';
    style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
    font-src 'self' https://fonts.gstatic.com;
    img-src 'self' blob: data:;
    connect-src 'self';
    frame-src 'self' blob: data:;
    worker-src 'self';
    manifest-src 'self';
    upgrade-insecure-requests; block-all-mixed-content;"
    />
    <title>HonzoReader</title>
    <link rel="icon" href="source.svg" type="image/svg+xml" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600&family=Merriweather:wght@300;400;700&family=IBM+Plex+Serif:wght@300;400;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <!-- Header -->
    <header id="app-header">
      <div class="header-left">
        <button
          id="toc-button"
          class="icon-btn"
          disabled
          aria-label="Table of Contents"
        >
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <line x1="3" y1="6" x2="21" y2="6" />
            <line x1="3" y1="12" x2="21" y2="12" />
            <line x1="3" y1="18" x2="21" y2="18" />
          </svg>
        </button>
        <button
          id="bookmarks-button"
          class="icon-btn"
          disabled
          aria-label="Bookmarks"
        >
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z" />
          </svg>
        </button>
      </div>
      <div class="header-center">
        <span class="app-title">HonzoReader</span>
        <span class="title-separator" id="title-sep" hidden>·</span>
        <span class="book-title" id="book-title"></span>
      </div>
      <div class="header-right">
        <nav class="header-nav">
          <a href="/Honzo/demo/convert.html">Convert</a>
          <a href="/Honzo/demo/inspect.html">Inspect</a>
        </nav>
        <button
          id="search-button"
          class="icon-btn"
          disabled
          aria-label="Search"
        >
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="11" cy="11" r="8" />
            <line x1="21" y1="21" x2="16.65" y2="16.65" />
          </svg>
        </button>
        <button
          id="meta-button"
          class="icon-btn"
          disabled
          aria-label="Book Info"
        >
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="12" r="10" />
            <line x1="12" y1="16" x2="12" y2="12" />
            <line x1="12" y1="8" x2="12.01" y2="8" />
          </svg>
        </button>
        <button
          id="settings-button"
          class="icon-btn"
          disabled
          aria-label="Settings"
        >
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="12" r="3" />
            <path
              d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"
            />
          </svg>
        </button>
        <div class="header-divider"></div>
        <select
          id="demo-book-select"
          class="demo-picker"
          aria-label="Demo book"
        >
          <option value="">Open demo...</option>
          <option value="/Honzo/demo/hzo/novel.hzo">Novel</option>
          <option value="/Honzo/demo/hzo/manga.hzo">Manga</option>
          <option value="/Honzo/demo/hzo/math.hzo">Math</option>
          <option value="/Honzo/demo/hzo/with_sidx.hzo">
            With Search Index
          </option>
          <option value="/Honzo/demo/hzo/compressed_lz4.hzo">
            LZ4 Compressed
          </option>
          <option value="/Honzo/demo/hzo/textbook.hzo">Textbook</option>
          <option value="/Honzo/demo/hzo/multilang.hzo">Multi-Language</option>
          <option value="/Honzo/demo/hzo/series.hzo">Series</option>
        </select>
        <button id="open-button" class="text-btn" aria-label="Open file">
          Open
        </button>
      </div>
    </header>

    <!-- Main reading area -->
    <main id="viewer" role="main"></main>

    <!-- Bottom bar -->
    <footer id="app-footer" hidden>
      <div class="footer-left">
        <button
          id="prev-button"
          class="icon-btn"
          disabled
          aria-label="Previous Chapter"
        >
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <polyline points="15 18 9 12 15 6" />
          </svg>
          <span class="btn-label">Prev</span>
        </button>
      </div>
      <div class="footer-center">
        <div class="progress-container">
          <div class="progress-bar-track" id="progress-track">
            <div class="progress-bar-fill" id="progress-fill"></div>
          </div>
          <div class="progress-info">
            <span id="current-page">1</span>
            <span class="progress-sep">/</span>
            <span id="total-pages">1</span>
            <span class="progress-chapter" id="chapter-label"></span>
          </div>
        </div>
      </div>
      <div class="footer-right">
        <button
          id="next-button"
          class="icon-btn"
          disabled
          aria-label="Next Chapter"
        >
          <span class="btn-label">Next</span>
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <polyline points="9 18 15 12 9 6" />
          </svg>
        </button>
      </div>
    </footer>

    <!-- Sidebar: TOC -->
    <nav class="sidebar sidebar-left" id="toc-sidebar" role="navigation">
      <div class="sidebar-header">
        <h2>Table of Contents</h2>
        <button id="close-toc" class="icon-btn" aria-label="Close TOC">
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" />
          </svg>
        </button>
      </div>
      <div class="sidebar-content" id="toc-content"></div>
    </nav>

    <!-- Sidebar: Bookmarks -->
    <nav class="sidebar sidebar-left" id="bookmarks-sidebar" role="navigation">
      <div class="sidebar-header">
        <h2>Bookmarks</h2>
        <button
          id="close-bookmarks"
          class="icon-btn"
          aria-label="Close Bookmarks"
        >
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" />
          </svg>
        </button>
      </div>
      <div class="sidebar-content" id="bookmarks-content"></div>
    </nav>

    <!-- Sidebar: Search -->
    <aside class="sidebar sidebar-right" id="search-sidebar">
      <div class="sidebar-header">
        <h2>Search</h2>
        <button id="close-search" class="icon-btn" aria-label="Close Search">
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" />
          </svg>
        </button>
      </div>
      <div class="sidebar-content">
        <div class="search-field">
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="11" cy="11" r="8" />
            <line x1="21" y1="21" x2="16.65" y2="16.65" />
          </svg>
          <input
            id="search-input"
            type="search"
            placeholder="Search..."
            autocomplete="off"
          />
        </div>
        <div class="search-status" id="search-status">
          Type a word to search.
        </div>
        <div class="search-results" id="search-results"></div>
      </div>
    </aside>

    <!-- Sidebar: Meta -->
    <aside class="sidebar sidebar-right sidebar-wide" id="meta-sidebar">
      <div class="sidebar-header">
        <h2>Book Info</h2>
        <button id="close-meta" class="icon-btn" aria-label="Close Book Info">
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" />
          </svg>
        </button>
      </div>
      <div class="sidebar-content" id="meta-content"></div>
    </aside>

    <!-- Sidebar: Settings -->
    <aside class="sidebar sidebar-right" id="settings-sidebar">
      <div class="sidebar-header">
        <h2>Settings</h2>
        <button
          id="close-settings"
          class="icon-btn"
          aria-label="Close Settings"
        >
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" />
          </svg>
        </button>
      </div>
      <div class="sidebar-content" id="settings-content"></div>
    </aside>

    <!-- Overlay -->
    <div class="overlay" id="overlay"></div>

    <!-- Loading -->
    <div class="message" id="loading-message">
      <div class="spinner"></div>
      <p>Loading your book...</p>
    </div>

    <!-- Error -->
    <div class="message error" id="error-message">
      <h3>Something went wrong</h3>
      <p id="error-text"></p>
      <button id="close-error" class="text-btn" style="margin-top: 1rem">
        Dismiss
      </button>
    </div>

    <!-- Hidden file inputs -->
    <input type="file" id="file-input" accept=".hzo" hidden />

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
