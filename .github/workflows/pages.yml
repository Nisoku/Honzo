name: Deploy GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Build everything
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'

      - name: Install just
        run: sudo apt-get update && sudo apt-get install -y just

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      # Build demo
      - name: Run setup
        run: just setup

      - name: Build Demo
        run: just demo build

      # Build Docs site
      - name: Build Docs
        run: just docs build

      # Prepare full page deploy directory
      - name: Prepare Pages assets
        run: |
          mkdir -p gh-pages-root
          # Docs (site) go to root
          cp -r Docs/site/* gh-pages-root/
          # Demo
          mkdir -p gh-pages-root/demo
          cp -r Demo/dist/* gh-pages-root/demo/

      - name: Upload Pages artifact
        uses: actions/upload-artifact@v4
        with:
          name: gh-pages-root
          path: gh-pages-root/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Pages artifact
        uses: actions/download-artifact@v4
        with:
          name: gh-pages-root
          path: gh-pages-root

      - name: Deploy all assets to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: gh-pages-root
          keep_files: false
          commit_message: Deploy Docs, Demo
