name: Release crates.io

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run cargo publish with --dry-run'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      packages:
        description: 'Which crates to publish (for retrying individual packages)'
        required: false
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'honzo-core'
          - 'honzo-chunks'
          - 'honzo-io'
          - 'honzo-convert'
          - 'honzo-c'
          - 'honzo-cli'

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read
    env:
      # On a release event only, publish every crate.
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == 'true' || false }}
      DO_CORE: ${{ github.event_name != 'workflow_dispatch' || inputs.packages == 'all' || inputs.packages == 'honzo-core' }}
      DO_CHUNKS: ${{ github.event_name != 'workflow_dispatch' || inputs.packages == 'all' || inputs.packages == 'honzo-chunks' }}
      DO_IO: ${{ github.event_name != 'workflow_dispatch' || inputs.packages == 'all' || inputs.packages == 'honzo-io' }}
      DO_CONVERT: ${{ github.event_name != 'workflow_dispatch' || inputs.packages == 'all' || inputs.packages == 'honzo-convert' }}
      DO_C: ${{ github.event_name != 'workflow_dispatch' || inputs.packages == 'all' || inputs.packages == 'honzo-c' }}
      DO_CLI: ${{ github.event_name != 'workflow_dispatch' || inputs.packages == 'all' || inputs.packages == 'honzo-cli' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish honzo-core
        if: env.DO_CORE == 'true'
        run: cargo publish -p honzo-core ${{ env.DRY_RUN == 'true' && '--dry-run' || '' }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Publish honzo-chunks
        if: env.DO_CHUNKS == 'true'
        run: cargo publish -p honzo-chunks ${{ env.DRY_RUN == 'true' && '--dry-run' || '' }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Publish honzo-io
        if: env.DO_IO == 'true'
        run: cargo publish -p honzo-io ${{ env.DRY_RUN == 'true' && '--dry-run' || '' }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Publish honzo-convert
        if: env.DO_CONVERT == 'true'
        run: cargo publish -p honzo-convert ${{ env.DRY_RUN == 'true' && '--dry-run' || '' }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Build honzo-c (refresh bindings)
        if: env.DO_C == 'true'
        run: cargo build -p honzo-c

      - name: Publish honzo-c
        if: env.DO_C == 'true'
        run: cargo publish -p honzo-c ${{ env.DRY_RUN == 'true' && '--dry-run' || '' }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          HONZO_GENERATE_BINDINGS: '0'

      - name: Publish honzo-cli
        if: env.DO_CLI == 'true'
        run: cargo publish -p honzo-cli ${{ env.DRY_RUN == 'true' && '--dry-run' || '' }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
