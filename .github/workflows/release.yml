name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and package only (skip GitHub release upload)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Install just
        run: sudo apt-get update && sudo apt-get install -y just

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run Rust setup
        run: just rust setup

      - name: Run tests
        run: cargo test --workspace

      - name: Run clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Check formatting
        run: cargo fmt --check

      - name: Build release
        run: cargo build --release

      - name: Build WASM adapter
        run: wasm-pack build --target web --out-dir ../../../Build/adapters/typescript/wasm
        working-directory: Build/crates/honzo-wasm

      - name: Build C library and generate headers
        run: |
          if command -v diplomat-tool >/dev/null 2>&1; then
            diplomat-tool c .
          fi
        working-directory: Build/crates/honzo-c

      - name: Create release archive
        run: |
          set -e
          ARCHIVE_NAME="honzo-${{ github.ref_name }}.tar.gz"
          rm -rf /tmp/honzo-release
          mkdir -p /tmp/honzo-release/{bin,lib,include,wasm}

          # CLI binary
          cp target/release/honzo-cli /tmp/honzo-release/bin/honzo-cli

          # Native artifacts
          for artifact in \
            "target/release/libhonzo_c.so" \
            "target/release/libhonzo_c.dylib" \
            "target/release/libhonzo_c.a" \
            "target/release/honzo_c.dll" \
            "target/release/honzo-c"*
          do
            if [ -f "$artifact" ]; then
              cp "$artifact" /tmp/honzo-release/lib/
            fi
          done 2>/dev/null || true

          # C headers
          if [ -d "Build/crates/honzo-c/include" ]; then
            cp -R Build/crates/honzo-c/include/. /tmp/honzo-release/include/
          fi

          # WASM package
          cp -R Build/adapters/typescript/wasm/. /tmp/honzo-release/wasm/

          # Docs
          cp README.md LICENSE /tmp/honzo-release/

          tar -czf "${ARCHIVE_NAME}" -C /tmp/honzo-release .

      - name: Create GitHub release
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run != 'true' }}
        uses: softprops/action-gh-release@v1
        with:
          files: honzo-${{ github.ref_name }}.tar.gz
          generate_release_notes: true
